<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>API de Produtos · Computação em Nuvem II</title>
  <style>
    body{font:16px Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#17233d;background:#f5f7fb}
    main{background:white;padding:28px;border-radius:14px;box-shadow:0 4px 20px #16254512}
    label{display:block;margin:16px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b9c5d7;border-radius:7px;font:inherit}
    button{margin-top:20px;padding:12px 18px;border:0;border-radius:7px;background:#245ad5;color:white;font:inherit;cursor:pointer}
    li{padding:12px 0;border-bottom:1px solid #e4e9f3}#mensagem{min-height:24px}a{color:#245ad5}
  </style>
</head>
<body><main>
  <h1>Cadastro de produtos</h1>
  <p>Atividade de Computação em Nuvem para Web II: GET e POST na tabela <code>produtos</code>.</p>
  <form id="formulario">
    <label for="nome">Nome do produto</label><input id="nome" name="nome" maxlength="100" required>
    <label for="preco">Preço (R$)</label><input id="preco" name="preco" type="number" min="0" max="99999999.99" step="0.01" required>
    <button type="submit">Cadastrar produto</button>
  </form>
  <p id="mensagem" role="status"></p>
  <h2>Produtos cadastrados</h2><button id="recarregar" type="button">Atualizar lista</button>
  <ul id="lista"></ul>
  <p>Endpoint para teste: <a href="/api/produtos">GET /api/produtos</a></p>
</main><script>
  const mensagem = document.querySelector('#mensagem');
  const lista = document.querySelector('#lista');
  async function carregar() {
    try {
      const resposta = await fetch('/api/produtos');
      const dados = await resposta.json();
      if (!resposta.ok) throw new Error(dados.erro || 'Falha ao listar produtos');
      lista.replaceChildren();
      if (!dados.length) { const item = document.createElement('li'); item.textContent = 'Nenhum produto cadastrado.'; lista.append(item); }
      for (const produto of dados) {
        const item = document.createElement('li');
        item.textContent = `${produto.nome} — ${Number(produto.preco).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}`;
        lista.append(item);
      }
    } catch (erro) { mensagem.textContent = erro.message; }
  }
  document.querySelector('#recarregar').addEventListener('click', carregar);
  document.querySelector('#formulario').addEventListener('submit', async evento => {
    evento.preventDefault(); mensagem.textContent = 'Salvando...';
    try {
      const resposta = await fetch('/api/produtos', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nome:document.querySelector('#nome').value,preco:Number(document.querySelector('#preco').value)})
      });
      const dados = await resposta.json();
      if (!resposta.ok) throw new Error(dados.erro || 'Falha ao cadastrar');
      evento.target.reset(); mensagem.textContent = `Produto ${dados.nome} cadastrado!`; await carregar();
    } catch (erro) { mensagem.textContent = erro.message; }
  });
  carregar();
</script></body></html>
